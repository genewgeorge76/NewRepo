name: Quality Gate

on:
  push:
    branches: [main, master, dev]
  pull_request:
    branches: [main, master]

jobs:
  typecheck:
    name: TypeScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm run type-check

  build-web:
    name: Build Web
    runs-on: ubuntu-latest
    needs: typecheck
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm run build -w apps/web
        env:
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}

  build-ops:
    name: Build Ops
    runs-on: ubuntu-latest
    needs: typecheck
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm run build -w apps/ops

  lint-python:
    name: Python API
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - working-directory: apps/api
        run: pip install -r requirements.txt
      - working-directory: apps/api
        run: python -c "from app.main import app; print('FastAPI app imports OK')"
        env:
          JWORDEN_MASTER_KEY: ci-test-key
          JWT_SECRET_KEY: ci-test-secret
      - name: Validate Alembic migrations (upgrade to head on SQLite)
        working-directory: apps/api
        run: python -m alembic upgrade head
        env:
          DATABASE_URL: sqlite:///./ci_migration_check.db
          JWORDEN_MASTER_KEY: ci-test-key
          JWT_SECRET_KEY: ci-test-secret

  pytest:
    name: Python Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - working-directory: apps/api
        run: pip install -r requirements.txt -r requirements-test.txt
      - working-directory: apps/api
        run: python -m pytest -q --timeout=60
        env:
          JWORDEN_MASTER_KEY: test-master-key
          JWT_SECRET_KEY: test-jwt-secret
          AUTO_CREATE_TABLES: 'true'
